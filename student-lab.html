<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Student Player Lab</title>
<style>
  :root { --bg: #0f1a12; --panel: rgba(10,16,12,.85); --ink: #f2f4ee; --dim: #a9b5a6; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #panel { position: fixed; top: 10px; left: 10px; background: var(--panel); padding: 10px 12px; border-radius: 10px; width: min(92vw, 360px); max-height: 90vh; overflow: auto; }
  #panel h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: .04em; }
  #panel label { display: block; margin-top: 6px; color: var(--dim); }
  #readout { margin-top: 8px; white-space: pre; color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  #err { position: fixed; bottom: 10px; left: 10px; right: 10px; background: #5a1010; padding: 8px 10px; border-radius: 8px; display: none; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>GAME STUDENT PLAYER (Male_Casual.fbx)</h1>
  <div><select id="clip"><option value="Man_Idle">Idle</option></select></div>
  <label><input type="checkbox" id="showCmu" checked> show CMU source skeleton beside him</label>
  <div id="readout">loading…</div>
</div>
<div id="err"></div>
<script type="module">
import * as THREE from './web/vendor/three.module.js';
import { FBXLoader } from './web/vendor/FBXLoader.js';
import { GLTFLoader } from './web/vendor/GLTFLoader.js';
import { OrbitControls } from './web/vendor/OrbitControls.js';

const showErr = (e) => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = String((e && e.stack) || e); };
window.addEventListener('error', (e) => showErr(e.error || e.message));

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fb8d0');
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 80);
camera.position.set(0.45, 1.1, 6.2);
camera.lookAt(0.45, 0.95, 0);
// drag to orbit, scroll or pinch to zoom, right-drag to pan
const orbit = new OrbitControls(camera, canvas);
orbit.target.set(0.45, 0.95, 0);
orbit.enableDamping = true;
// wheel-drag zooms the camera; without limits it could dolly through the figure and make it disappear
orbit.minDistance = 1.5;
orbit.maxDistance = 12;
orbit.update();
window.__view = (pos, target) => { camera.position.set(...pos); orbit.target.set(...target); orbit.update(); };
scene.add(new THREE.HemisphereLight(0xffffff, 0x665544, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(3, 6, 4); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ color: '#c99a5b', roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

// ---------------------------------------------------------------------------------------------------------
// Student rig rest data (filled when the FBX loads). The rig is an IK rig: the feet and the knee pole targets
// are parented to the root bone, and the built-in clips animate the feet; the shins are not keyed.
const studentBones = {}, studentRestW = {}, studentRestPos = {}, studentRestQ = {}, studentRestWP = {};
const CMU_CLIPS = ['jumpshot', 'layup', 'dribble_run'];
const isCmu = (n) => CMU_CLIPS.includes(n);

// CMU mocap clips (the game's own court clips) mapped onto the student's rig.
// For each limb segment the student bone takes the CMU bone's rotation since its rest (which carries the twist
// about the bone), turned into the student's facing, and then a small swing makes its segment point exactly where
// the CMU segment points. Parents come first, so each local rotation is taken against the parent's fitted rotation.
const SEGMENTS = [
  // [CMU bone whose rotation is carried, CMU joint the segment starts at, CMU joint it ends at, student bone].
  // CMU LowerBack sits on Hips and Neck sits on Spine1 (zero-length bones), so the spine directions use the next
  // joints that actually move apart; the chest and head take the CMU bone's rotation alone (no direction to match).
  ['Hips', 'Hips', 'Spine', 'Hips'], ['Spine', 'Spine', 'Spine1', 'Abdomen'], ['Spine1', null, null, 'Torso'],
  ['Neck', 'Neck', 'Head', 'Neck'], ['Head', null, null, 'Head'],
  ['LeftShoulder', 'LeftShoulder', 'LeftArm', 'ShoulderL'], ['LeftArm', 'LeftArm', 'LeftForeArm', 'UpperArmL'], ['LeftForeArm', 'LeftForeArm', 'LeftHand', 'LowerArmL'],
  ['RightShoulder', 'RightShoulder', 'RightArm', 'ShoulderR'], ['RightArm', 'RightArm', 'RightForeArm', 'UpperArmR'], ['RightForeArm', 'RightForeArm', 'RightHand', 'LowerArmR'],
  ['LeftUpLeg', 'LeftUpLeg', 'LeftLeg', 'UpperLegL'], ['LeftLeg', 'LeftLeg', 'LeftFoot', 'LowerLegL'],
  ['RightUpLeg', 'RightUpLeg', 'RightLeg', 'UpperLegR'], ['RightLeg', 'RightLeg', 'RightFoot', 'LowerLegR'],
];
// the student joint each segment ends at
const SEG_CHILD = { Hips: 'Abdomen', Abdomen: 'Torso', Torso: 'Neck', Neck: 'Head', ShoulderL: 'UpperArmL', UpperArmL: 'LowerArmL', LowerArmL: 'PalmL', ShoulderR: 'UpperArmR', UpperArmR: 'LowerArmR', LowerArmR: 'PalmR', UpperLegL: 'LowerLegL', LowerLegL: 'FootL', UpperLegR: 'LowerLegR', LowerLegR: 'FootR' };

function retargetWorld(clip, cmuScene) {
  cmuScene.updateMatrixWorld(true);
  const cBones = {}; cmuScene.traverse((o) => { if (o.isBone) cBones[o.name] = o; });
  const cRestW = {}, cRestWP = {}, cLocalRest = {}, cPosRest = {};
  for (const n in cBones) {
    const b = cBones[n];
    cRestW[n] = b.getWorldQuaternion(new THREE.Quaternion());
    cRestWP[n] = b.getWorldPosition(new THREE.Vector3());
    cLocalRest[n] = b.quaternion.clone();
    cPosRest[n] = b.position.clone();
  }
  const interp = {};
  for (const t of clip.tracks) {
    const dot = t.name.lastIndexOf('.');
    (interp[t.name.slice(0, dot)] ||= {})[t.name.slice(dot + 1)] = t.createInterpolant();
  }
  // A: the facing alignment between the rigs. Both stand y-up, so it is a yaw about world up, taken from the hip line.
  const flat = (v) => { v.y = 0; return v.normalize(); };
  const latC = flat(cRestWP.LeftUpLeg.clone().sub(cRestWP.RightUpLeg));
  const latS = flat(studentRestWP.UpperLegL.clone().sub(studentRestWP.UpperLegR));
  const A = latC.dot(latS) < -0.9999 ? new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI)
    : new THREE.Quaternion().setFromUnitVectors(latC, latS);
  const Ainv = A.clone().invert();
  // size ratio (student / CMU) from leg length, for the vertical motion
  const leg = (P, a, b, c) => P[a].distanceTo(P[b]) + P[b].distanceTo(P[c]);
  const k = leg(studentRestWP, 'UpperLegL', 'LowerLegL', 'FootL') / leg(cRestWP, 'LeftUpLeg', 'LeftLeg', 'LeftFoot');
  // Body.position carries the vertical motion: a world-up offset expressed in the Body bone's parent space
  const body = studentBones.Body; body.parent.updateWorldMatrix(true, false);
  const pInv = body.parent.matrixWorld.clone().invert();
  const o0 = new THREE.Vector3().applyMatrix4(pInv);
  const bRest = studentRestPos.Body;
  const sjRest = {};
  for (const sn of Object.keys(SEG_CHILD)) {
    const a = studentRestWP[sn], b = studentRestWP[SEG_CHILD[sn]];
    if (a && b) sjRest[sn] = b.clone().sub(a).normalize();
  }
  const cLocalAt = (n, time) => {
    const it = interp[n];
    if (it && it.quaternion) { const r = it.quaternion.evaluate(time); return new THREE.Quaternion(r[0], r[1], r[2], r[3]); }
    return cLocalRest[n].clone();
  };
  const fps = 60, N = Math.max(2, Math.round(clip.duration * fps) + 1);
  const outTimes = [], outRot = {}, outPos = [], cmuFrames = [];
  for (const seg of SEGMENTS) outRot[seg[3]] = [];
  let hip0 = null, minY = Infinity;
  for (let i = 0; i < N; i++) {
    const time = Math.min(clip.duration, i / fps);
    outTimes.push(time);
    const cW = {}, cP = {};
    const cWorld = (n) => {
      if (cW[n]) return cW[n];
      const b = cBones[n];
      const pName = b && b.parent && b.parent.isBone ? b.parent.name : null;
      cW[n] = (pName ? cWorld(pName) : new THREE.Quaternion()).clone().multiply(cLocalAt(n, time));
      return cW[n];
    };
    const cPos = (n) => {
      if (cP[n]) return cP[n];
      const b = cBones[n];
      const pName = b && b.parent && b.parent.isBone ? b.parent.name : null;
      const base = pName ? cPos(pName).clone() : new THREE.Vector3();
      const rest = cPosRest[n].clone();
      if (interp[n] && interp[n].position) { const r = interp[n].position.evaluate(time); rest.set(r[0], r[1], r[2]); }
      cP[n] = base.add(rest.applyQuaternion(pName ? cWorld(pName) : new THREE.Quaternion()));
      return cP[n];
    };
    const sDes = {};
    for (const [rb, cf, ct, sn] of SEGMENTS) {
      if (!studentBones[sn] || !cBones[rb]) { if (studentBones[sn]) sDes[sn] = studentRestW[sn].clone(); continue; }
      const dQ = A.clone().multiply(cWorld(rb)).multiply(cRestW[rb].clone().invert()).multiply(Ainv);
      const base = dQ.clone().multiply(studentRestW[sn]);
      const seg = cf && ct && cBones[cf] && cBones[ct] && sjRest[sn] ? cPos(ct).clone().sub(cPos(cf)) : null;
      if (seg && seg.lengthSq() > 1e-8) {
        const tS = seg.normalize().applyQuaternion(A);
        const dir = sjRest[sn].clone().applyQuaternion(dQ);
        sDes[sn] = new THREE.Quaternion().setFromUnitVectors(dir, tS).multiply(base);
      } else sDes[sn] = base;
    }
    for (const [, , , sn] of SEGMENTS) {
      const sb = studentBones[sn];
      if (!sb) continue;
      let p = sb.parent; while (p && !p.isBone) p = p.parent;
      const pW = (p && (sDes[p.name] || studentRestW[p.name])) || new THREE.Quaternion();
      const local = pW.clone().invert().multiply(sDes[sn]);
      outRot[sn].push(local.x, local.y, local.z, local.w);
    }
    // the CMU hips' height change, scaled to the student (this is the jump lift)
    const hy = cPos('Hips').y; if (hip0 === null) hip0 = hy;
    const d = new THREE.Vector3(0, (hy - hip0) * k, 0).applyMatrix4(pInv).sub(o0);
    outPos.push(bRest.x + d.x, bRest.y + d.y, bRest.z + d.z);
    // the CMU skeleton itself, for the side-by-side view
    const fr = {}; for (const n in cBones) { fr[n] = cPos(n).clone(); minY = Math.min(minY, fr[n].y); }
    cmuFrames.push(fr);
  }
  const tracks = [];
  for (const sn of Object.keys(outRot)) if (outRot[sn].length === N * 4) tracks.push(new THREE.QuaternionKeyframeTrack(sn + '.quaternion', outTimes, outRot[sn]));
  tracks.push(new THREE.VectorKeyframeTrack('Body.position', outTimes, outPos));
  const pairs = [];
  for (const n in cBones) { const p = cBones[n].parent; if (p && p.isBone && !/Finger|Thumb|Index|Toe_End|_end/i.test(n)) pairs.push([p.name, n]); }
  const hips0 = cmuFrames[0].Hips.clone(); hips0.y = 0;
  return { clip: new THREE.AnimationClip(clip.name, clip.duration, tracks), cmuFrames, pairs, A, k, fps, hips0, floorY: -minY * k };
}

// the CMU source skeleton, drawn beside the student at his scale and facing (toggle in the panel)
const cmuView = {};
const cmuLines = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: '#16246b' }));
cmuLines.visible = false; cmuLines.frustumCulled = false; scene.add(cmuLines);
const CMU_SIDE = new THREE.Vector3(0.95, 0, 0);
window.__cmuSide = (x, z) => CMU_SIDE.set(x, 0, z);
function drawCmuSkeleton(name, time) {
  const r = cmuView[name];
  if (!r || !document.getElementById('showCmu').checked) { cmuLines.visible = false; return; }
  const fr = r.cmuFrames[Math.min(r.cmuFrames.length - 1, Math.max(0, Math.round(time * r.fps)))];
  const pos = new Float32Array(r.pairs.length * 6);
  const show = (p) => p.clone().sub(r.hips0).multiplyScalar(r.k).applyQuaternion(r.A).add(CMU_SIDE).add(new THREE.Vector3(0, r.floorY, 0));
  r.pairs.forEach(([a, b], i) => { const pa = show(fr[a]), pb = show(fr[b]); pos.set([pa.x, pa.y, pa.z, pb.x, pb.y, pb.z], i * 6); });
  cmuLines.geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  cmuLines.visible = true;
}

// dribble ball: the hand pushes it down, it leaves the hand at the bottom of the stroke, drops to the floor,
// bounces, and meets the hand again at the top of the stroke
const BALL_R = 0.12, BALL_OFF = 0.13;   // ball centre sits this far below the palm bone while in the hand
const ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 24, 16), new THREE.MeshStandardMaterial({ color: '#d9621e', roughness: 0.7 }));
ball.visible = false; scene.add(ball);
let dribble = null;   // { T, tTop, tBot, yTop, yBot } from the clip, measured once
function placeBall(time) {
  const palm = studentBones.PalmR;
  if (window.__activeClip !== 'dribble_run' || !dribble || !palm) { ball.visible = false; return; }
  const v = palm.getWorldPosition(new THREE.Vector3());
  const { T, tTop, tBot, yTop, yBot } = dribble;
  const t = ((time % T) + T) % T;
  const since = (a) => (((t - a) % T) + T) % T;
  const push = since(tTop), pushLen = (((tBot - tTop) % T) + T) % T;
  let y;
  if (push <= pushLen) y = v.y - BALL_OFF;                         // in the hand, pushed down with it
  else {
    const u = since(tBot) / (T - pushLen), ub = 0.4;             // flight: down to the floor, bounce, up to the hand
    const y0 = yBot - BALL_OFF, y1 = yTop - BALL_OFF;
    if (u < ub) { const s = u / ub; y = y0 + (BALL_R - y0) * (0.5 * s + 0.5 * s * s); }
    else { const s = (u - ub) / (1 - ub); y = BALL_R + (y1 - BALL_R) * (1 - (1 - s) * (1 - s)); }
  }
  ball.position.set(v.x, Math.max(BALL_R, y), v.z);
  ball.visible = true;
}

// two-bone leg IK for the built-in clips: the shin reaches the animated foot, the knee bends toward its pole target
const legRest = {};
const setWorldQuat = (bone, q) => {
  const pq = bone.parent.getWorldQuaternion(new THREE.Quaternion());
  bone.quaternion.copy(pq.invert().multiply(q));
  bone.updateWorldMatrix(false, true);
};
function legIK(sd) {
  const up = studentBones['UpperLeg' + sd], lo = studentBones['LowerLeg' + sd], ft = studentBones['Foot' + sd], pole = studentBones['PoleTarget' + sd];
  const R = legRest[sd];
  const H = up.getWorldPosition(new THREE.Vector3()), T = ft.getWorldPosition(new THREE.Vector3());
  const ht = T.clone().sub(H), dist = ht.length(); if (dist < 1e-6) return;
  const u = ht.divideScalar(dist);
  const d = Math.min(R.l1 + R.l2 - 1e-4, Math.max(Math.abs(R.l1 - R.l2) + 1e-4, dist));
  const a = (R.l1 * R.l1 - R.l2 * R.l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, R.l1 * R.l1 - a * a));
  const bend = (pole ? pole.getWorldPosition(new THREE.Vector3()) : H.clone().add(new THREE.Vector3(0, 0, 1))).sub(H);
  bend.sub(u.clone().multiplyScalar(bend.dot(u)));
  if (bend.lengthSq() < 1e-10) bend.set(0, 0, 1);
  bend.normalize();
  const K = H.clone().add(u.clone().multiplyScalar(a)).add(bend.multiplyScalar(h));
  const qU = up.getWorldQuaternion(new THREE.Quaternion());
  const nU = new THREE.Quaternion().setFromUnitVectors(R.dUp.clone().applyQuaternion(qU), K.clone().sub(H).normalize()).multiply(qU);
  setWorldQuat(up, nU);
  const qL = nU.clone().multiply(lo.quaternion);
  const nL = new THREE.Quaternion().setFromUnitVectors(R.dLo.clone().applyQuaternion(qL), T.clone().sub(K).normalize()).multiply(qL);
  lo.quaternion.copy(nU.clone().invert().multiply(nL));
  lo.updateWorldMatrix(false, true);
}
// CMU clips: each foot is carried by its shin (the retarget drives the shin, not the foot)
function attachFoot(sd) {
  const lo = studentBones['LowerLeg' + sd], ft = studentBones['Foot' + sd];
  const dQ = lo.getWorldQuaternion(new THREE.Quaternion()).multiply(studentRestW['LowerLeg' + sd].clone().invert());
  const tP = studentRestWP['Foot' + sd].clone().sub(studentRestWP['LowerLeg' + sd]).applyQuaternion(dQ).add(lo.getWorldPosition(new THREE.Vector3()));
  const tQ = dQ.multiply(studentRestW['Foot' + sd]);
  const par = ft.parent; par.updateWorldMatrix(true, false);
  ft.position.copy(tP.applyMatrix4(par.matrixWorld.clone().invert()));
  ft.quaternion.copy(par.getWorldQuaternion(new THREE.Quaternion()).invert().multiply(tQ));
  ft.updateWorldMatrix(false, true);
}
// The feet are posed by hand for the CMU clips. When a clip starts they go back to rest, so a clip that does not
// animate them (Idle has no foot track) never inherits another clip's feet. This is done only when a clip starts:
// the mixer writes a property only when its value changes, so a per-frame reset would win over constant tracks.
function resetFeet() {
  for (const n of ['FootL', 'FootR']) { const b = studentBones[n]; if (b) { b.position.copy(studentRestPos[n]); b.quaternion.copy(studentRestQ[n]); } }
}
const floorOff = {};
function poseAfterMixer() {
  const fbx = window.__fbx, cmu = isCmu(window.__activeClip);
  fbx.position.y = window.__fbxRestY + (cmu ? (floorOff[window.__activeClip] || 0) : 0);
  fbx.updateMatrixWorld(true);
  if (cmu) { attachFoot('L'); attachFoot('R'); } else { legIK('L'); legIK('R'); }
}

let mixer = null;
const actionsByName = {};
new FBXLoader().load('./web/college/student_Male_Casual.fbx', (fbx) => {
  scene.add(fbx);
  const meshes = [], mats = new Set();
  fbx.traverse((o) => { if (o.isMesh) { meshes.push(o.name || '(unnamed)'); for (const m of [].concat(o.material)) mats.add(`${m.name}`); } });
  const box = new THREE.Box3().setFromObject(fbx);
  const h = box.max.y - box.min.y;
  const s = 1.81 / Math.max(h, 1e-6);          // show the game's 1.81 m body height
  fbx.scale.setScalar(s);
  fbx.position.y = -box.min.y * s;             // stand on the floor
  // the game's colours for the student (court_player_model.gd build_student, court_game.gd look)
  const COL = { Skin: '#7a573d', Shirt: '#eab84d', Pants: '#1f3368', Socks: '#f2f2f2', Shoes: '#f2f2f2', Hair: '#141210' };
  // The FBX loader makes Phong materials, whose specular highlight roughness cannot remove. Swap each for a
  // matte standard material in the game's colour (the game's shaders are matte: roughness 0.85-0.95, no metal).
  fbx.traverse((o) => {
    if (!o.isMesh) return;
    o.material = [].concat(o.material).map((m) => COL[m.name]
      ? new THREE.MeshStandardMaterial({ name: m.name, color: COL[m.name], roughness: m.name === 'Skin' || m.name === 'Hair' ? 0.85 : 0.95, metalness: 0 }) : m);
    if (o.material.length === 1) o.material = o.material[0];
  });
  fbx.updateMatrixWorld(true);
  fbx.traverse((o) => {
    if (!o.isBone) return;
    studentBones[o.name] = o;
    studentRestW[o.name] = o.getWorldQuaternion(new THREE.Quaternion());
    studentRestWP[o.name] = o.getWorldPosition(new THREE.Vector3());
    studentRestPos[o.name] = o.position.clone();
    studentRestQ[o.name] = o.quaternion.clone();
  });
  window.__fbxRestY = fbx.position.y;
  for (const sd of ['L', 'R']) {
    const H = studentRestWP['UpperLeg' + sd], K = studentRestWP['LowerLeg' + sd], T = studentRestWP['Foot' + sd];
    legRest[sd] = {
      l1: H.distanceTo(K), l2: K.distanceTo(T),
      dUp: K.clone().sub(H).normalize().applyQuaternion(studentRestW['UpperLeg' + sd].clone().invert()),
      dLo: T.clone().sub(K).normalize().applyQuaternion(studentRestW['LowerLeg' + sd].clone().invert()),
    };
  }
  // the clips name their tracks 'HumanArmature|Body.position'; the bone is just 'Body', so the prefix must go
  // or the mixer skips those tracks (this is why Man_Sitting never sat down)
  const clips = (fbx.animations || []).map((c) => new THREE.AnimationClip(c.name.replace('HumanArmature|', ''), c.duration,
    c.tracks.map((t) => { const nt = t.clone(); nt.name = t.name.replace(/^HumanArmature\|/, ''); return nt; })));
  const bones = []; fbx.traverse((o) => { if (o.isBone) bones.push(o.name); });
  mixer = new THREE.AnimationMixer(fbx);
  window.__clips = clips;
  for (const c of clips) actionsByName[c.name] = mixer.clipAction(c);
  window.__actions = actionsByName;
  window.__fbx = fbx; window.__sb = studentBones; window.__floorOff = floorOff; window.__cmuView = cmuView;
  window.__activeClip = null;
  // per CMU clip, measured once: the floor offset (the lowest foot point over the clip touches the floor, so the
  // jump still lifts) and, for the dribble, the hand's stroke
  const calibrateCmu = (name) => {
    const a = actionsByName[name]; if (!a) return;
    const dur = a.getClip().duration, saved = a.time; let minY = Infinity;
    const palm = [];
    for (let t = 0; t <= dur + 1e-6; t += 1 / 60) {
      a.time = Math.min(t, dur); mixer.update(0);
      fbx.position.y = window.__fbxRestY; fbx.updateMatrixWorld(true);
      attachFoot('L'); attachFoot('R');
      for (const n of ['FootL', 'FootR', 'FootL_end', 'FootR_end']) if (studentBones[n]) minY = Math.min(minY, studentBones[n].getWorldPosition(new THREE.Vector3()).y);
      palm.push([a.time, studentBones.PalmR.getWorldPosition(new THREE.Vector3()).y]);
    }
    a.time = saved; mixer.update(0);
    floorOff[name] = -minY;
    if (name === 'dribble_run') {
      let top = palm[0], bot = palm[0];
      for (const p of palm) { if (p[1] > top[1]) top = p; if (p[1] < bot[1]) bot = p; }
      dribble = { T: dur, tTop: top[0], tBot: bot[0], yTop: top[1] - minY, yBot: bot[1] - minY };
      window.__dribble = dribble;
    }
  };
  const play = (name) => {
    const a = actionsByName[name]; if (!a) return;
    resetFeet();
    for (const x of Object.values(actionsByName)) if (x !== a) x.fadeOut(0.2);
    a.reset().fadeIn(0.2).play();
    window.__activeClip = name;
    if (isCmu(name) && !(name in floorOff)) setTimeout(() => calibrateCmu(name), 600);
  };
  window.__play = play;
  // the dropdown lists every clip (built-in and CMU), so each one can be shown
  const fillClipList = () => {
    const sel = document.getElementById('clip');
    const keep = sel.value;
    sel.innerHTML = '';
    for (const k of Object.keys(actionsByName)) { const o = document.createElement('option'); o.value = k; o.textContent = k.replace('Man_', ''); sel.appendChild(o); }
    if (actionsByName[keep]) sel.value = keep;
  };
  const gl = new GLTFLoader();
  for (const f of CMU_CLIPS) {
    gl.load(`./web/college/${f}.glb`, (g) => {
      // each file also holds the full take (e.g. 124_05) and a .001 copy; only the clip named after the file is used
      const c = g.animations.find((x) => x.name === f);
      if (!c) { showErr(`no clip named ${f} in ${f}.glb`); return; }
      const r = retargetWorld(c, g.scene);
      cmuView[f] = r;
      actionsByName[f] = mixer.clipAction(r.clip);
      fillClipList();
    }, undefined, (e) => showErr(e));
  }
  play('Man_Idle');
  fillClipList();
  document.getElementById('clip').addEventListener('change', (e) => play(e.target.value));
  document.getElementById('readout').textContent =
    `raw height ${h.toFixed(2)} (scaled to 1.81 m)\n` +
    `meshes: ${meshes.join(', ')}\n` +
    `materials: ${[...mats].join(', ')}\n` +
    `clips: ${clips.map((c) => c.name).join(', ') || 'none'}\nbones: ${bones.join(', ')}`;
}, undefined, (e) => showErr(e));

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
const clock = new THREE.Clock();
function frame() {
  const dt = clock.getDelta();
  if (mixer && window.__fbx) {
    mixer.update(dt);
    poseAfterMixer();
    const a = actionsByName[window.__activeClip];
    const t = a ? a.time : 0;
    placeBall(t);
    if (isCmu(window.__activeClip)) drawCmuSkeleton(window.__activeClip, t); else cmuLines.visible = false;
  }
  orbit.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Student Player Lab</title>
<style>
  :root { --bg: #0f1a12; --panel: rgba(10,16,12,.85); --ink: #f2f4ee; --dim: #a9b5a6; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #panel { position: fixed; top: 10px; left: 10px; background: var(--panel); padding: 10px 12px; border-radius: 10px; width: min(92vw, 360px); max-height: 90vh; overflow: auto; }
  #panel h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: .04em; }
  #readout { margin-top: 8px; white-space: pre; color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  #err { position: fixed; bottom: 10px; left: 10px; right: 10px; background: #5a1010; padding: 8px 10px; border-radius: 8px; display: none; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>GAME STUDENT PLAYER (Male_Casual.fbx)</h1>
  <div><select id="clip"><option value="Man_Idle">Idle</option><option value="Man_Walk">Walk</option><option value="Man_Run">Run</option><option value="jumpshot">Jump shot (CMU)</option><option value="layup">Layup (CMU)</option><option value="dribble_run">Dribble (CMU)</option></select></div>
  <div id="readout">loading…</div>
</div>
<div id="err"></div>
<script type="module">
import * as THREE from './web/vendor/three.module.js';
import { FBXLoader } from './web/vendor/FBXLoader.js';
import { GLTFLoader } from './web/vendor/GLTFLoader.js';

const showErr = (e) => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = String((e && e.stack) || e); };
window.addEventListener('error', (e) => showErr(e.error || e.message));

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fb8d0');
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 80);
camera.position.set(0, 1.1, 5.2);
camera.lookAt(0, 0.95, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x665544, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(3, 6, 4); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ color: '#c99a5b', roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

// CMU mocap clips (the game's own court clips) mapped onto the student's rig.
const CMU_TO_STUDENT = {
  Hips: 'Hips', LowerBack: 'Abdomen', Spine1: 'Torso', Neck: 'Neck', Head: 'Head',
  LeftShoulder: 'ShoulderL', LeftArm: 'UpperArmL', LeftForeArm: 'LowerArmL', LeftHand: 'PalmL',
  RightShoulder: 'ShoulderR', RightArm: 'UpperArmR', RightForeArm: 'LowerArmR', RightHand: 'PalmR',
  LeftUpLeg: 'UpperLegL', LeftLeg: 'LowerLegL', LeftFoot: 'FootL',
  RightUpLeg: 'UpperLegR', RightLeg: 'LowerLegR', RightFoot: 'FootR',
};
const studentBones = {}, studentRestW = {}, studentRestPos = {};
// Per-frame direction fit. For each limb segment (a bone and its child), the CMU segment's world direction
// is brought into the student's rest frame and the student bone is rotated so its segment points the same
// way (swing from the student's rest direction to the target). Parents come first, so each bone's local
// rotation is taken against its parent's fitted world rotation. Feet stay flat in world space.
const SEGMENTS = [
  // [CMU parent, CMU child, student bone]
  ['Hips', 'LowerBack', 'Hips'], ['LowerBack', 'Spine1', 'Abdomen'], ['Spine1', 'Neck', 'Torso'], ['Neck', 'Head', 'Neck'],
  ['LeftShoulder', 'LeftArm', 'ShoulderL'], ['LeftArm', 'LeftForeArm', 'UpperArmL'], ['LeftForeArm', 'LeftHand', 'LowerArmL'],
  ['RightShoulder', 'RightArm', 'ShoulderR'], ['RightArm', 'RightForeArm', 'UpperArmR'], ['RightForeArm', 'RightHand', 'LowerArmR'],
  ['LeftUpLeg', 'LeftLeg', 'UpperLegL'], ['LeftLeg', 'LeftFoot', 'LowerLegL'],
  ['RightUpLeg', 'RightLeg', 'UpperLegR'], ['RightLeg', 'RightFoot', 'LowerLegR'],
];
function retargetWorld(clip, cmuScene) {
  cmuScene.updateMatrixWorld(true);
  const cBones = {}; cmuScene.traverse((o) => { if (o.isBone) cBones[o.name] = o; });
  const cRestW = {}, cRestP = {}, cLocalRest = {};
  for (const n in cBones) {
    cRestW[n] = cBones[n].getWorldQuaternion(new THREE.Quaternion());
    cLocalRest[n] = cBones[n].quaternion.clone();
  }
  // CMU rest offsets in parent space (the clip only moves the hips in translation)
  const cPosRest = {}; for (const n in cBones) cPosRest[n] = cBones[n].position.clone();
  const interp = {};
  for (const t of clip.tracks) {
    const dot = t.name.lastIndexOf('.');
    const bone = t.name.slice(0, dot), prop = t.name.slice(dot + 1);
    (interp[bone] ||= {})[prop] = t.createInterpolant();
  }
  const fps = 60, N = Math.max(2, Math.round(clip.duration * fps) + 1);
  const outTimes = [];
  const outRot = {}; for (const seg of SEGMENTS) outRot[seg[2]] = [];
  const outPos = [];
  const hipHs = [];
  // student rest: world quats and world positions
  const sBone = {}; for (const seg of SEGMENTS) sBone[seg[2]] = studentBones[seg[2]];
  const sRestP = {}; for (const seg of SEGMENTS) { const b = studentBones[seg[2]]; if (b) { const v = new THREE.Vector3(); b.getWorldPosition(v); sRestP[seg[2]] = v; } }
  const childRestP = (cn) => { return null; };
  const sChildRestP = {};
  for (const seg of SEGMENTS) { const [pc, cc, sn] = seg; const sc = studentBones[sn]; /* child is the next student bone along the chain */ }
  // student rest world position of each segment's child joint (the joint the segment ends at)
  const SEG_CHILD = { Hips: 'Abdomen', Abdomen: 'Torso', Torso: 'Neck', Neck: 'Head', ShoulderL: 'UpperArmL', UpperArmL: 'LowerArmL', LowerArmL: 'PalmL', ShoulderR: 'UpperArmR', UpperArmR: 'LowerArmR', LowerArmR: 'PalmR', UpperLegL: 'LowerLegL', LowerLegL: 'FootL', UpperLegR: 'LowerLegR', LowerLegR: 'FootR' };
  const sjRest = {};
  for (const sn of Object.keys(SEG_CHILD)) {
    const cb = studentBones[SEG_CHILD[sn]];
    if (!cb || !studentBones[sn]) continue;
    const a = new THREE.Vector3(), b = new THREE.Vector3();
    studentBones[sn].getWorldPosition(a); cb.getWorldPosition(b);
    sjRest[sn] = b.clone().sub(a).normalize();
  }
  const cLocalAt = (n, time) => {
    const it = interp[n];
    if (it && it.quaternion) { const r = it.quaternion.evaluate(time); return new THREE.Quaternion(r[0], r[1], r[2], r[3]); }
    return cLocalRest[n].clone();
  };
  for (let i = 0; i < N; i++) {
    const time = Math.min(clip.duration, i / fps);
    outTimes.push(time);
    // CMU world rotations and world positions, parent first
    const cW = {}, cP = {};
    const cWorld = (n) => {
      if (cW[n]) return cW[n];
      const b = cBones[n];
      const pName = b && b.parent && b.parent.isBone ? b.parent.name : null;
      const pW = pName ? cWorld(pName) : new THREE.Quaternion();
      cW[n] = pW.clone().multiply(cLocalAt(n, time));
      return cW[n];
    };
    const cPos = (n) => {
      if (cP[n]) return cP[n];
      const b = cBones[n];
      const pName = b && b.parent && b.parent.isBone ? b.parent.name : null;
      let base = new THREE.Vector3(0, 0, 0);
      if (pName) base = cPos(pName).clone();
      const rest = cPosRest[n].clone();
      if (n === 'Hips' && interp['Hips'] && interp['Hips'].position) { const r = interp['Hips'].position.evaluate(time); rest.set(r[0], r[1], r[2]); }
      const pW = pName ? cWorld(pName) : new THREE.Quaternion();
      cP[n] = base.add(rest.applyQuaternion(pW));
      return cP[n];
    };
    // fitted student world rotations, one per segment bone, in SEGMENTS order (parents first)
    const sDes = {};
    for (const [cp, cc, sn] of SEGMENTS) {
      if (!sjRest[sn]) {
        // no segment direction (e.g. the palm or feet): keep the student's rest orientation
        sDes[sn] = studentRestW[sn].clone();
        continue;
      }
      const tC = cPos(cc).clone().sub(cPos(cp)).normalize();
      // bring the CMU direction into the student's frame via the parent's rest alignment
      // the student's parent bone at rest, for the same parent the CMU bone is attached to
      let sParent = studentBones[sn].parent; while (sParent && !sParent.isBone) sParent = sParent.parent;
      // global CMU->student rest frame, taken at the hips: the per-bone parent frame rotated the thighs outward
      const A = studentRestW['Hips'].clone().multiply(cRestW['Hips'].clone().invert());
      const tS = tC.applyQuaternion(A).normalize();
      const swing = new THREE.Quaternion().setFromUnitVectors(sjRest[sn], tS);
      sDes[sn] = swing.multiply(studentRestW[sn].clone());
    }
    // local rotation against each bone's parent (fitted when the parent is a segment bone, else at rest)
    for (const [cp, cc, sn] of SEGMENTS) {
      const sb = studentBones[sn];
      if (!sb) continue;
      let pW = new THREE.Quaternion();
      let p = sb.parent;
      while (p && !p.isBone) p = p.parent;
      if (p && p.isBone) pW = sDes[p.name] || studentRestW[p.name] || pW;
      const local = pW.clone().invert().multiply(sDes[sn]);
      outRot[sn].push(local.x, local.y, local.z, local.w);
    }
    // hip height above the lowest foot, measured per frame from the CMU skeleton (glTF units; only the ratio is used)
    const hipH = cPos('Hips').y - Math.min(cPos('LeftFoot').y, cPos('RightFoot').y);
    hipHs.push(hipH);
  }
  // Body.position.y follows the CMU hip height as a ratio of its frame-0 value, so units never need converting.
  // The body dips into squats and rises into the jump; the feet are still grounded per frame in frame().
  const h0 = hipHs[0];
  const bRest = studentRestPos['Body'];
  if (bRest && h0 > 1e-6) {
    for (let i = 0; i < N; i++) outPos.push(bRest.x, bRest.y * (hipHs[i] / h0), bRest.z);
  }
  const tracks = [];
  for (const sn of Object.keys(outRot)) {
    if (outRot[sn].length !== N * 4) continue;
    tracks.push(new THREE.QuaternionKeyframeTrack(sn + '.quaternion', outTimes, outRot[sn]));
  }
  if (outPos.length === N * 3) tracks.push(new THREE.VectorKeyframeTrack('Body.position', outTimes, outPos));
  return new THREE.AnimationClip(clip.name, clip.duration, tracks);
}
// dribble ball: rides the right palm during the dribble clip. The CMU hand never reaches the floor (min ~0.8 m),
// so this is hand-carried, not a floor bounce.
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.12, 24, 16), new THREE.MeshStandardMaterial({ color: '#d9621e', roughness: 0.7 }));
ball.visible = false; scene.add(ball);
let mixer = null;
new FBXLoader().load('./web/college/student_Male_Casual.fbx', (fbx) => {
  fbx.scale.setScalar(1);
  scene.add(fbx);
  const meshes = [], mats = new Set();
  fbx.traverse((o) => {
    if (o.isMesh) { meshes.push(o.name || '(unnamed)'); for (const m of [].concat(o.material)) mats.add(`${m.name}`); }
  });
  const box = new THREE.Box3().setFromObject(fbx);
  const h = box.max.y - box.min.y;
  fbx.position.y -= box.min.y;                 // stand on the floor
  const s = 1.81 / Math.max(h, 1e-6);          // show the game's 1.81 m body height
  fbx.scale.setScalar(s);
  fbx.position.y = -box.min.y * s;
  // the game's colours for the student (court_player_model.gd build_student, court_game.gd look)
  const COL = { Skin: '#7a573d', Shirt: '#eab84d', Pants: '#1f3368', Socks: '#f2f2f2', Shoes: '#f2f2f2', Hair: '#141210' };
  // The FBX loader makes Phong materials, whose specular highlight roughness cannot remove. Swap each for a
  // matte standard material in the game's colour (the game's shaders are matte: roughness 0.85-0.95, no metal).
  fbx.traverse((o) => {
    if (!o.isMesh) return;
    o.material = [].concat(o.material).map((m) => {
      if (!COL[m.name]) return m;
      return new THREE.MeshStandardMaterial({ name: m.name, color: COL[m.name], roughness: m.name === 'Skin' || m.name === 'Hair' ? 0.85 : 0.95, metalness: 0 });
    });
    if (o.material.length === 1) o.material = o.material[0];
  });
  fbx.updateMatrixWorld(true);
  fbx.traverse((o) => { if (o.isBone) { studentBones[o.name] = o; studentRestW[o.name] = o.getWorldQuaternion(new THREE.Quaternion()); studentRestPos[o.name] = o.position.clone(); } });
  // rest world pose of each shin and foot, so each foot can be carried by its shin (the rig parents the feet to the root)
  window.__fbxRestY = fbx.position.y;
  window.__ankleRest = {};
  for (const sd of ['L', 'R']) {
    const lo = studentBones['LowerLeg' + sd], ft = studentBones['Foot' + sd];
    if (!lo || !ft) continue;
    window.__ankleRest[sd] = {
      lowerP: lo.getWorldPosition(new THREE.Vector3()), lowerQ: lo.getWorldQuaternion(new THREE.Quaternion()),
      footP: ft.getWorldPosition(new THREE.Vector3()), footQ: ft.getWorldQuaternion(new THREE.Quaternion()),
    };
  }
  // the clips name their tracks 'HumanArmature|Body.position'; the bone is just 'Body', so the prefix must go
  // or the mixer skips those tracks (this is why Man_Sitting never sat down)
  const clips = (fbx.animations || []).map((c) => new THREE.AnimationClip(c.name.replace('HumanArmature|', ''), c.duration,
    c.tracks.map((t) => { const nt = t.clone(); nt.name = t.name.replace(/^HumanArmature\|/, ''); return nt; })));
  const bones = []; fbx.traverse((o) => { if (o.isBone) bones.push(o.name); });
  mixer = new THREE.AnimationMixer(fbx);
  const actionsByName = {};
  window.__clips = clips;
  for (const c of clips) actionsByName[c.name] = mixer.clipAction(c);
  window.__actions = actionsByName;
  window.__fbx = fbx; window.__sb = studentBones;
  // per CMU clip: lift the body so the lowest foot point over the whole clip sits on the floor (this keeps the jump lift)
  const floorOff = (window.__floorOff = {});
  window.__activeClip = null;
  const calibrateFloor = (name) => {
    const a = actionsByName[name]; if (!a || !window.__ankleRest || !window.__ankleRest.L) return;
    const dur = a.getClip().duration, saved = a.time; let minY = Infinity;
    for (let t = 0; t <= dur; t += 1 / 30) {
      a.time = t; mixer.update(0);
      window.__fbx.position.y = window.__fbxRestY; window.__fbx.updateMatrixWorld(true);
      attachFoot('L'); attachFoot('R');
      for (const n of ['FootL', 'FootR']) { const v = new THREE.Vector3(); window.__sb[n].getWorldPosition(v); minY = Math.min(minY, v.y); }
    }
    a.time = saved; mixer.update(0);
    floorOff[name] = -minY;
  };
  const play = (name) => {
    const a = actionsByName[name]; if (!a) return;
    for (const x of Object.values(actionsByName)) x.fadeOut(0.2);
    a.reset().fadeIn(0.2).play();
    window.__activeClip = name;
    if (!(name in floorOff)) setTimeout(() => calibrateFloor(name), 600);
  };
  // CMU clips: each file has its own rig rest; hips translation is scaled by the ratio of hip heights
  const cmuFiles = ['jumpshot', 'layup', 'dribble_run'];
  const gl = new GLTFLoader();
  for (const f of cmuFiles) {
    gl.load(`./web/college/${f}.glb`, (g) => {
      const cmuRest = {}; let cmuHip = null;
      g.scene.traverse((o) => { if (o.isBone) { cmuRest[o.name] = o.quaternion.clone(); if (o.name === 'Hips') cmuHip = o.position.y; } });
      const sHip = studentRestPos['Hips'] ? studentRestPos['Hips'].y : 1;
      for (const c of g.animations) {
        // the CMU clip files each hold a second copy (.001); keep the named one
        if (c.name === f || c.name === f + '.001' || c.name === '124_05' || c.name === '06_02' || c.name === '124_06' || f === 'jumpshot' || f === 'layup' || f === 'dribble_run') {
          if (/\.001$/.test(c.name)) continue;
          const rc = retargetWorld(c, g.scene);
          actionsByName[f] = mixer.clipAction(rc);
          if (window.__fillClipList) window.__fillClipList();
        }
      }
    });
  }
  play('Man_Idle');
  // the dropdown lists every clip (built-in and CMU), so each one can be shown
  const fillClipList = () => {
    const sel = document.getElementById('clip');
    const keep = sel.value;
    sel.innerHTML = '';
    for (const k of Object.keys(actionsByName)) { const o = document.createElement('option'); o.value = k; o.textContent = k.replace('Man_', ''); sel.appendChild(o); }
    if (actionsByName[keep]) sel.value = keep;
  };
  window.__fillClipList = fillClipList;
  fillClipList();
  document.getElementById('clip').addEventListener('change', (e) => play(e.target.value));
  document.getElementById('readout').textContent =
    `raw height ${h.toFixed(2)} (scaled to 1.81 m)\n` +
    `meshes: ${meshes.join(', ')}\n` +
    `materials: ${[...mats].join(', ')}\n` +
    `clips: ${clips.map((c) => c.name).join(', ') || 'none'}
bones: ${bones.join(', ')}
` +
    ['UpperLegL', 'UpperLegR', 'ShoulderL', 'ShoulderR', 'FootL', 'FootR'].map((n) => { const b = studentBones[n]; if (!b) return n + ' missing'; const w = new THREE.Vector3(); b.getWorldPosition(w); const hp = new THREE.Vector3(); studentBones['Hips'].getWorldPosition(hp); return `${n} dx=${(w.x - hp.x).toFixed(3)} dz=${(w.z - hp.z).toFixed(3)} dy=${(w.y - hp.y).toFixed(3)}`; }).join(String.fromCharCode(10));
}, undefined, (e) => showErr(e));

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
const clock = new THREE.Clock();
// place each foot at its shin's ankle, carrying the shin's animated rotation change onto the foot
function attachFoot(sd) {
  const R = window.__ankleRest[sd];
  const lo = window.__sb['LowerLeg' + sd], ft = window.__sb['Foot' + sd];
  lo.updateWorldMatrix(true, false);
  const lowP = lo.getWorldPosition(new THREE.Vector3());
  const lowQ = lo.getWorldQuaternion(new THREE.Quaternion());
  const dQ = lowQ.clone().multiply(R.lowerQ.clone().invert());          // shin's rotation change since rest
  const off = R.footP.clone().sub(R.lowerP).applyQuaternion(dQ);         // rest ankle offset, rotated with the shin
  const tP = lowP.clone().add(off);
  const tQ = dQ.clone().multiply(R.footQ.clone());                       // foot world orientation
  const par = ft.parent; par.updateWorldMatrix(true, false);
  const pInv = par.matrixWorld.clone().invert();
  const parQ = par.getWorldQuaternion(new THREE.Quaternion());
  ft.position.copy(tP.applyMatrix4(pInv));
  ft.quaternion.copy(parQ.clone().invert().multiply(tQ));
  ft.updateWorldMatrix(true, false);
}
function frame() {
  if (mixer) mixer.update(clock.getDelta());
  // body height comes from the clip's hip track (Body.position); the feet follow their shins. No per-frame
  // grounding: pinning the lowest foot to the floor cancelled the jump lift.
  if (window.__fbx && window.__ankleRest && window.__ankleRest.L && window.__ankleRest.R) {
    window.__fbx.position.y = window.__fbxRestY + (window.__floorOff[window.__activeClip] || 0);
    window.__fbx.updateMatrixWorld(true);
    attachFoot('L');
    attachFoot('R');
  }
  if (window.__sb && window.__sb.PalmR && window.__activeClip === 'dribble_run') {
    const v = new THREE.Vector3(); window.__sb.PalmR.getWorldPosition(v);
    ball.visible = true; ball.position.set(v.x, v.y - 0.12, v.z);
  } else ball.visible = false;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

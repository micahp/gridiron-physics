<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quaternius Character Lab</title>
<style>
  :root { --bg: #0f1a12; --panel: rgba(10,16,12,.85); --ink: #f2f4ee; --dim: #a9b5a6; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #panel { position: fixed; top: 10px; left: 10px; background: var(--panel); padding: 10px 12px; border-radius: 10px; width: min(92vw, 320px); }
  #panel h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: .04em; }
  #panel select, #panel button { background: #1d2b20; color: var(--ink); border: 1px solid #39503d; border-radius: 6px; padding: 4px 8px; font: inherit; margin: 2px 4px 2px 0; }
  #readout { margin-top: 8px; white-space: pre; color: var(--dim); font-variant-numeric: tabular-nums; }
  #err { position: fixed; bottom: 10px; left: 10px; right: 10px; background: #5a1010; padding: 8px 10px; border-radius: 8px; display: none; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>QUATERNIUS CHARACTER · STANDARD PACKS (CC0)</h1>
  <div>
    <select id="clip">
      <option value="Idle_Loop">Idle</option>
      <option value="Walk_Loop">Walk</option>
      <option value="Jog_Fwd_Loop">Jog</option>
    </select>
    <select id="view">
      <option value="front">front</option>
      <option value="side">side</option>
      <option value="rear">rear</option>
      <option value="game">gameplay</option>
    </select>
  </div>
  <div id="readout"></div>
</div>
<div id="err"></div>
<script type="module">
import * as THREE from './web/vendor/three.module.js';
import { GLTFLoader } from './web/vendor/GLTFLoader.js';

const showErr = (e) => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = String((e && e.stack) || e); };
window.addEventListener('error', (e) => showErr(e.error || e.message));
const $ = (id) => document.getElementById(id);

const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fb8d0');
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 80);
scene.add(new THREE.HemisphereLight(0xeef2ff, 0x33452c, 1.4));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.8); sun.position.set(3, 6, 4); sun.castShadow = true; scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ color: '#c99a5b', roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// The character's feet are at y = 0. The character faces +z in the glTF; the view names say where the camera sits.
const VIEWS = {
  front: [[0, 1.1, 5.2]], side: [[5.2, 1.1, 0]], rear: [[0, 1.1, -5.2]], game: [[2.2, 1.6, 4.0]],
};
function setView(name) {
  const [p] = VIEWS[name];
  camera.position.set(p[0], p[1], p[2]);
  camera.lookAt(0, 0.95, 0);
}
setView('front');

// The animation library (DEF- bone names) drives the base character (Unreal-style bone names).
// Both are the same Universal rig; only the names differ, so tracks are renamed bone by bone.
// Fingers have no counterpart in the body-only mapping and are dropped.
const SIDE = { L: '_l', R: '_r' };
const BONE_MAP = {
  root: 'root', 'DEF-hips': 'pelvis', 'DEF-spine.001': 'spine_01', 'DEF-spine.002': 'spine_02', 'DEF-spine.003': 'spine_03',
  'DEF-neck': 'neck_01', 'DEF-head': 'Head',
};
for (const s of ['L', 'R']) {
  Object.assign(BONE_MAP, {
    [`DEF-shoulder.${s}`]: 'clavicle' + SIDE[s], [`DEF-upper_arm.${s}`]: 'upperarm' + SIDE[s], [`DEF-forearm.${s}`]: 'lowerarm' + SIDE[s],
    [`DEF-hand.${s}`]: 'hand' + SIDE[s], [`DEF-thigh.${s}`]: 'thigh' + SIDE[s], [`DEF-shin.${s}`]: 'calf' + SIDE[s],
    [`DEF-foot.${s}`]: 'foot' + SIDE[s], [`DEF-toe.${s}`]: 'ball' + SIDE[s],
  });
}
// Rest poses of both rigs. A clip's rotations are relative to its rig's rest pose, so each rotation is
// re-expressed as: base rest * inverse(anim rest) * clip rotation. Without this the base keeps its own T-pose.
let animRest = {}, baseRest = {};
// three.js sanitises node names on load (it drops the dots), so track and rest-pose names are compared in that form.
const sanitize = (s) => s.replace(/\s/g, '_').replace(/[\[\]\/\:\.]/g, '');
const MAP_S = Object.fromEntries(Object.entries(BONE_MAP).map(([k, v]) => [sanitize(k), v]));
function retarget(clip) {
  const tracks = [];
  const q = new THREE.Quaternion(), out = new THREE.Quaternion();
  for (const t of clip.tracks) {
    const dot = t.name.lastIndexOf('.');
    const bone = t.name.slice(0, dot), prop = t.name.slice(dot + 1);
    if (!(bone in MAP_S)) continue;
    const target = MAP_S[bone];
    let values = t.values;
    if (prop === 'quaternion' && animRest[bone] && baseRest[target]) {
      const inv = animRest[bone].clone().invert();   // anim rest for this sanitised bone name
      values = new Float32Array(t.values.length);
      for (let k = 0; k < t.values.length; k += 4) {
        q.set(t.values[k], t.values[k + 1], t.values[k + 2], t.values[k + 3]);
        out.copy(baseRest[target]).multiply(inv).multiply(q).normalize();
        values[k] = out.x; values[k + 1] = out.y; values[k + 2] = out.z; values[k + 3] = out.w;
      }
    }
    const TrackClass = t.constructor;
    tracks.push(new TrackClass(target + '.' + prop, t.times, values));
  }
  return new THREE.AnimationClip(clip.name, clip.duration, tracks);
}

let mixer = null, actions = {}, character = null;
const loader = new GLTFLoader();
const loadGLTF = (url) => new Promise((ok, bad) => loader.load(url, ok, undefined, bad));
Promise.all([
  loadGLTF('./web/quaternius/base/Superhero_Male_FullBody.gltf'),
  loadGLTF('./web/quaternius/AnimationLibrary_Godot_Standard.glb'),
]).then(([base, anim]) => {
  character = base.scene;
  character.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(character);
  character.traverse((o) => { if (o.isBone) baseRest[o.name] = o.quaternion.clone(); });
  anim.scene.traverse((o) => { if (o.name) animRest[o.name] = o.quaternion.clone(); });
  mixer = new THREE.AnimationMixer(character);
  let kept = 0;
  for (const clip of anim.animations) {
    const rc = retarget(clip);
    if (rc.tracks.length) { actions[clip.name] = mixer.clipAction(rc); kept++; }
  }
  play('Idle_Loop');
  const box = new THREE.Box3().setFromObject(character);
  const idleClip = actions['Idle_Loop'] && actions['Idle_Loop'].getClip();
  const bound = idleClip ? idleClip.tracks.filter((t) => { try { return THREE.PropertyBinding.findNode(character, t.name.slice(0, t.name.lastIndexOf('.'))) !== null; } catch (e) { return false; } }).length : 0;
  $('readout').textContent = `base character: Superhero male (CC0)\n${kept} clips retargeted; ${(box.max.y - box.min.y).toFixed(2)} m tall\nIdle_Loop tracks: ${idleClip ? idleClip.tracks.length : 0}, bones found: ${bound}`;
}).catch((e) => showErr(e));

function play(name) {
  if (!actions[name]) return;
  const next = actions[name];
  for (const a of Object.values(actions)) if (a !== next) a.fadeOut(0.2);
  next.reset().fadeIn(0.2).play();
}
$('clip').addEventListener('change', (e) => play(e.target.value));
$('view').addEventListener('change', (e) => setView(e.target.value));

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
const clock = new THREE.Clock();
function frame() {
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  if (character && window.__dbg === undefined) window.__dbg = 0;
  if (character && (window.__dbgT = (window.__dbgT || 0) + dt) > 0.5) {
    window.__dbgT = 0;
    const ua = character.getObjectByName('upperarm_l');
    const txt = ua ? `upperarm_l q=(${ua.quaternion.x.toFixed(3)}, ${ua.quaternion.y.toFixed(3)}, ${ua.quaternion.z.toFixed(3)}, ${ua.quaternion.w.toFixed(3)}) mixer t=${mixer.time.toFixed(2)}` : 'no upperarm_l';
    const aw = actions['Idle_Loop'] ? actions['Idle_Loop'].getEffectiveWeight().toFixed(2) : 'none';
    const ak = Object.keys(animRest).filter((k) => /upper|hips|spine/.test(k)).join(',');
    const tk = actions['Idle_Loop'] ? actions['Idle_Loop'].getClip().tracks.slice(0, 4).map((t) => t.name).join(',') : '';
    window.__dbgLine = txt + ` | idle weight ${aw} | animRest ${ak} | tracks ${tk}`;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

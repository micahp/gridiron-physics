<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>College Player Lab</title>
<style>
  :root { --bg: #0f1a12; --panel: rgba(10,16,12,.85); --ink: #f2f4ee; --dim: #a9b5a6; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #panel { position: fixed; top: 10px; left: 10px; background: var(--panel); padding: 10px 12px; border-radius: 10px; width: min(92vw, 320px); }
  #panel h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: .04em; }
  #panel select { background: #1d2b20; color: var(--ink); border: 1px solid #39503d; border-radius: 6px; padding: 4px 8px; font: inherit; margin: 2px 4px 2px 0; }
  #readout { margin-top: 8px; white-space: pre; color: var(--dim); font-variant-numeric: tabular-nums; }
  #err { position: fixed; bottom: 10px; left: 10px; right: 10px; background: #5a1010; padding: 8px 10px; border-radius: 8px; display: none; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>COLLEGE GAME PLAYER</h1>
  <div>
    <select id="clip">
      <option value="Idle_Loop">Idle</option>
      <option value="Walk_Loop">Walk</option>
      <option value="Jog_Fwd_Loop">Jog</option>
    </select>
    <select id="view">
      <option value="front">front</option>
      <option value="side">side</option>
      <option value="rear">rear</option>
      <option value="game">gameplay</option>
    </select>
  </div>
  <div id="readout"></div>
</div>
<div id="err"></div>
<script type="module">
import * as THREE from './web/vendor/three.module.js';
import { GLTFLoader } from './web/vendor/GLTFLoader.js';

const showErr = (e) => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = String((e && e.stack) || e); };
window.addEventListener('error', (e) => showErr(e.error || e.message));
const $ = (id) => document.getElementById(id);

const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fb8d0');
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 80);
scene.add(new THREE.HemisphereLight(0xeef2ff, 0x33452c, 1.4));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.8); sun.position.set(3, 6, 4); sun.castShadow = true; scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ color: '#c99a5b', roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const VIEWS = {
  front: [[0, 1.0, 4.6]], side: [[4.6, 1.0, 0]], rear: [[0, 1.0, -4.6]], game: [[2.0, 1.5, 3.6]],
};
function setView(name) {
  const [p] = VIEWS[name];
  camera.position.set(p[0], p[1], p[2]);
  camera.lookAt(0, 0.92, 0);
}
setView('front');

// Both files use the same bone names (pelvis, upperarm_l, ...). Clip rotations are relative to the
// animation rig's rest pose, so each is re-expressed against the player's rest pose:
// player rest * inverse(anim rest) * clip rotation.
const sanitize = (s) => s.replace(/\s/g, '_').replace(/[\[\]\/\:\.]/g, '');
let animRest = {}, playerRest = {};
function retarget(clip) {
  const q = new THREE.Quaternion(), out = new THREE.Quaternion();
  const tracks = [];
  for (const t of clip.tracks) {
    const dot = t.name.lastIndexOf('.');
    const bone = t.name.slice(0, dot), prop = t.name.slice(dot + 1);
    let values = t.values;
    if (prop === 'quaternion' && animRest[bone] && playerRest[bone]) {
      const inv = animRest[bone].clone().invert();
      values = new Float32Array(t.values.length);
      for (let k = 0; k < t.values.length; k += 4) {
        q.set(t.values[k], t.values[k + 1], t.values[k + 2], t.values[k + 3]);
        out.copy(playerRest[bone]).multiply(inv).multiply(q).normalize();
        values[k] = out.x; values[k + 1] = out.y; values[k + 2] = out.z; values[k + 3] = out.w;
      }
    }
    tracks.push(new t.constructor(bone + '.' + prop, t.times, values));
  }
  return new THREE.AnimationClip(clip.name, clip.duration, tracks);
}

let mixer = null, actions = {}, character = null;
const loader = new GLTFLoader();
const load = (url) => new Promise((ok, bad) => loader.load(url, ok, undefined, bad));
Promise.all([load('./web/college/player.glb'), load('./web/college/ual_standard.glb')]).then(([player, anim]) => {
  character = player.scene;
  character.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(character);
  character.traverse((o) => { if (o.isBone) playerRest[sanitize(o.name)] = o.quaternion.clone(); });
  anim.scene.traverse((o) => { if (o.name) animRest[sanitize(o.name)] = o.quaternion.clone(); });
  mixer = new THREE.AnimationMixer(character);
  for (const clip of anim.animations) actions[clip.name] = mixer.clipAction(retarget(clip));
  play('Idle_Loop');
  const box = new THREE.Box3().setFromObject(character);
  $('readout').textContent = `college game player (player.glb)\n${(box.max.y - box.min.y).toFixed(2)} m bounds at rest\nclips from ual_standard.glb`;
}).catch((e) => showErr(e));

function play(name) {
  if (!actions[name]) return;
  const next = actions[name];
  for (const a of Object.values(actions)) if (a !== next) a.fadeOut(0.2);
  next.reset().fadeIn(0.2).play();
}
$('clip').addEventListener('change', (e) => play(e.target.value));
$('view').addEventListener('change', (e) => setView(e.target.value));

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
const clock = new THREE.Clock();
function frame() {
  if (mixer) mixer.update(clock.getDelta());
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

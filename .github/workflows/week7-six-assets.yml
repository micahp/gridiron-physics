name: Build Week 7 six-matchup demo assets
on:
  push:
    branches: [feat/week7-six-matchup-sim-ui-2026-10-24]
    paths:
      - 'pipeline/build_week7_six.py'
      - 'pipeline/fetch_prototype_data.py'
      - 'web/week7*.js'
      - 'week7.html'
      - '.github/workflows/week7-six-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch pinned 2025 and 2026 inputs
        run: python3 pipeline/fetch_prototype_data.py
      - name: Build twelve teams and six matchups
        run: python3 pipeline/build_week7_six.py
      - name: Check all six are loadable
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/teams/week7-six-2026-10-24.json').read_text())
          assert len(s['matchups']) == 6 and len(s['teams']) == 12
          for game in s['matchups']:
              for team in (game['home'],game['away']):
                  assert s['teams'][team]['roster']
                  b=json.loads(Path(f'data/playbooks/{team}-2025.json').read_text())
                  assert b['offense']['play_candidates']['run']['candidates']
                  assert b['offense']['play_candidates']['pass']['candidates']
          print('PASS 6 games, 12 rosters, 12 playbooks')
          PY
      - name: Commit generated source-pinned assets to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/teams/week7-six-2026-10-24.json data/playbooks
          if git diff --cached --quiet; then echo "No asset changes"; exit 0; fi
          git commit -m "data: generate six-game 2026 roster and 2025 playbook bundle"
          git push origin HEAD:feat/week7-six-matchup-sim-ui-2026-10-24

name: Build licensed Week 7 audio clips
on:
  push:
    branches: [feat/week7-stadium-audio-2026-10-24]
    paths:
      - 'pipeline/build_week7_audio.py'
      - '.github/workflows/build-week7-audio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download licensed publisher source archives and transcode
        run: python3 pipeline/build_week7_audio.py
      - name: Check planned audio events
        run: node --test test/week7-audio.mjs
      - name: Verify 11 OGG assets decode
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path('web/audio')
          manifest=json.loads((p/'MANIFEST.json').read_text())
          assert len(manifest['files'])==11
          for item in manifest['files']:
              path=p/item['filename']
              assert path.stat().st_size > 1000
              subprocess.run(['ffprobe','-v','error','-show_entries','stream=codec_name',
                              '-of','default=noprint_wrappers=1',str(path)],check=True)
          print('PASS 11 licensed audio files')
          PY
      - name: Commit reproducible audio assets to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/audio/
          if git diff --cached --quiet; then echo "No changed audio assets"; exit 0; fi
          git commit -m "assets(audio): add licensed stadium crowd, impacts, whistles and footsteps"
          git push origin HEAD:feat/week7-stadium-audio-2026-10-24

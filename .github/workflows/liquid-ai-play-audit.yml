name: Liquid AI play audit
on:
  push:
    branches: [research/liquid-ai-play-audit-2026-11-28]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-liquid-ai-play.mjs audit-output
      - name: Passing role and catch opportunity audit
        run: |
          git cat-file -e ca5850254e43c07117da2bf70f01ec867405c713^{commit} || git fetch --depth=1 origin ca5850254e43c07117da2bf70f01ec867405c713
          git show ca5850254e43c07117da2bf70f01ec867405c713:engine/autonomous/passing.js > engine/autonomous/.audit-baseline-pass.js
          node scripts/audit-liquid-pass.mjs audit-output
          rm engine/autonomous/.audit-baseline-pass.js
      - name: Passing contracts
        run: |
          node test/autonomous-coverage-reaction.mjs
          node test/autonomous-receiving-state.mjs
          node test/autonomous-contest-order.mjs
          node test/autonomous-pass.mjs
      - name: Paired run-controller audit
        run: |
          git cat-file -e 3ab7083b7b073ac775e5b4205818bdfad92e517c^{commit} || git fetch --depth=1 origin 3ab7083b7b073ac775e5b4205818bdfad92e517c
          git show 3ab7083b7b073ac775e5b4205818bdfad92e517c:engine/autonomous-run.js > engine/.audit-baseline-run.js
          node scripts/compare-liquid-run.mjs audit-output
          rm engine/.audit-baseline-run.js
      - run: node test/autonomous-public-order.mjs
      - run: node test/autonomous-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquid-ai-play-audit
          path: audit-output/

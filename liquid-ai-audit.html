<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liquid AI | Tick debugger</title>
<style>body{font:14px system-ui;background:#101820;color:#e8f0f4;margin:20px}h1{font-size:22px}button,select,input{font:inherit}button,select{padding:7px;background:#243340;color:#fff;border:1px solid #455666;border-radius:4px}button:disabled{opacity:.4}main{display:grid;grid-template-columns:minmax(300px,1.5fr) minmax(260px,1fr);gap:16px}canvas{width:100%;background:#174a35;border:1px solid #73978a}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#17242d;padding:12px;max-height:540px;overflow:auto}label{display:inline-block;margin:5px}#timeline{width:100%}table{border-collapse:collapse;width:100%}td,th{padding:4px;border-bottom:1px solid #42505a;text-align:right}td:first-child,th:first-child{text-align:left}@media(max-width:740px){main{grid-template-columns:1fr}}</style>
<h1>Liquid AI / native-tick play debugger</h1>
<p>Open one or more generated play-*.json traces. Recorded engine state, not reconstructed motion.</p>
<label>Trace files <input id="files" type="file" accept=".json" multiple></label><select id="play"></select>
<div><button id="prev">Previous tick</button> <button id="next">Next tick</button> <button id="decision">Next selected-player change</button> <button id="event">Next event</button> <button id="toggle">Play</button> <label>Phase <select id="phase"><option value="before">Before decision</option><option value="after_arbitration">After arbitration</option><option value="after_physics">After physics</option></select></label></div>
<input id="timeline" type="range" min="0" max="0" value="0"><p id="info"></p>
<main><section><canvas id="field" width="1000" height="540"></canvas><p id="outcome"></p><h3>Events at tick</h3><pre id="events"></pre></section><section><label>Player <select id="role"></select></label><h3>Actual lane score components</h3><div id="lanes"></div><h3>Controller memory and intent</h3><pre id="memory"></pre></section></main>
<script>
const $=id=>document.getElementById(id), traces=[];let trace=null,index=0,timer=null;
const ctx=$('field').getContext('2d'), meter=.9144, fieldWidth=160/3;
const stop=()=>{clearInterval(timer);timer=null;$('toggle').textContent='Play'};
function selectTrace(){stop();trace=traces[Number($('play').value)];index=0;$('timeline').max=trace.ticks.length-1;$('role').replaceChildren();for(const p of trace.ticks[0].before.players){let o=new Option(p.role||p.slot||p.id,p.id);$('role').add(o);if(p.role==='O.RB')o.selected=true;}render()}
$('files').onchange=async()=>{try{for(const f of $('files').files){const t=JSON.parse(await f.text());if(t.schema!=='gridiron.liquid-ai-tick-audit.v1'||!t.ticks?.length)continue;traces.push(t);$('play').add(new Option(t.call.play_id||t.call.kind||f.name,traces.length-1))}if(traces.length){$('play').value=traces.length-1;selectTrace()}}catch(e){$('info').textContent=e.message}};
$('play').onchange=selectTrace;$('role').onchange=$('phase').onchange=render;
function go(n){if(!trace)return;index=Math.max(0,Math.min(n,trace.ticks.length-1));render()}
$('timeline').oninput=e=>{stop();go(Number(e.target.value))};$('prev').onclick=()=>{stop();go(index-1)};$('next').onclick=()=>{stop();go(index+1)};
$('toggle').onclick=()=>{if(timer){stop();return}if(!trace)return;$('toggle').textContent='Pause';timer=setInterval(()=>{if(index>=trace.ticks.length-1)stop();else go(index+4)},1000/30)};
$('decision').onclick=()=>{stop();if(!trace)return;let id=$('role').value;let current=trace.ticks[index].decisions.find(d=>d.id===id)?.after.ai;for(let j=index+1;j<trace.ticks.length;j++){let next=trace.ticks[j].decisions.find(d=>d.id===id)?.after.ai;let keys=['assignment','decision','lane','runnerState','quarterbackState','routeIndex','protectionReleased','runRecognized','blockOn'];if(keys.some(k=>JSON.stringify(current?.[k])!==JSON.stringify(next?.[k]))){go(j);return}}go(trace.ticks.length-1)};
$('event').onclick=()=>{stop();if(!trace)return;let j=trace.ticks.findIndex((t,i)=>i>index&&(t.events.length||t.before.event_count>trace.ticks[i-1].after_physics.event_count));go(j<0?trace.ticks.length-1:j)};
function render(){if(!trace)return;let t=trace.ticks[index],w=t[$('phase').value],id=$('role').value,p=w.players.find(x=>x.id===id),d=t.decisions.find(x=>x.id===id);$('timeline').value=index;$('info').textContent='Tick '+index+'/'+(trace.ticks.length-1)+' | '+w.time_s.toFixed(4)+' s | '+w.ball.state+' | '+(w.ball.holder?.player_ref??'no holder');
const X=x=>((x/meter+10)/120)*1000,Y=y=>y/meter/fieldWidth*540;ctx.fillStyle='#174a35';ctx.fillRect(0,0,1000,540);ctx.strokeStyle='#b7d4c1';ctx.lineWidth=1;for(let x=0;x<=100;x+=5){let a=X(x*meter);ctx.beginPath();ctx.moveTo(a,0);ctx.lineTo(a,540);ctx.stroke()}let los=trace.call.situation?.yardline_100;if(los!=null){ctx.strokeStyle='#ffcc57';ctx.beginPath();ctx.moveTo(X(los*meter),0);ctx.lineTo(X(los*meter),540);ctx.stroke()}
for(let p of w.players){let x=X(p.position_m.x),y=Y(p.position_m.y);ctx.fillStyle=p.team==='O'||p.team==='K'?'#a9d8ff':'#f48d82';ctx.beginPath();ctx.arc(x,y,p.id===id?10:7,0,Math.PI*2);ctx.fill();ctx.strokeStyle=p.id===id?'#ffff00':'#14232c';ctx.stroke();ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.fillText(p.slot??p.role??p.id,x+9,y-7);let v=p.desired_velocity_mps;ctx.strokeStyle=p.id===id?'#ffd45c':'#ffffff55';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X(p.position_m.x+v.x*.35),Y(p.position_m.y+v.y*.35));ctx.stroke()}
ctx.fillStyle='#f6d365';ctx.beginPath();ctx.arc(X(w.ball.x),Y(w.ball.y),4,0,Math.PI*2);ctx.fill();$('outcome').textContent=JSON.stringify(trace.record.result??trace.record.failure);let between=index===0?trace.record.events.slice(0,t.before.event_count):trace.record.events.slice(trace.ticks[index-1].after_physics.event_count,t.before.event_count);$('events').textContent=JSON.stringify([...between,...t.events],null,2);
let reasons=(t.reasons??[]).filter(r=>r.player_id===id);let scored=reasons.find(r=>r.type==='rb_lane_scores');$('lanes').replaceChildren();if(!scored){$('lanes').textContent='No lane evaluation at this tick.'}else{let table=document.createElement('table');let header=table.insertRow();for(let s of ['Gap','Threat','Support','Cut','Aim','Score']){let h=document.createElement('th');h.textContent=s;header.append(h)}for(let r of scored.candidates){let row=table.insertRow();for(let v of [r.gap,r.threat,r.support,r.cutCost,r.aimingCost,r.score])row.insertCell().textContent=typeof v==='number'?v.toFixed(3):v}$('lanes').append(table)}$('memory').textContent=JSON.stringify({before:d?.before,after:d?.after,world_player:p,reasons,observations:t.memory.filter(m=>m.observer===id)},null,2)}
</script></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Basketball Lab</title>
<style>
  :root { --bg: #0f1a12; --panel: rgba(10,16,12,.85); --ink: #f2f4ee; --dim: #a9b5a6; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #panel { position: fixed; top: 10px; left: 10px; background: var(--panel); padding: 10px 12px; border-radius: 10px; width: min(92vw, 340px); }
  #panel h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: .04em; }
  #panel input[type=range] { width: 100%; }
  #panel button { background: #1d2b20; color: var(--ink); border: 1px solid #39503d; border-radius: 6px; padding: 4px 10px; font: inherit; margin-right: 6px; }
  #readout { margin-top: 8px; font-variant-numeric: tabular-nums; white-space: pre; color: var(--dim); }
  #note { margin-top: 6px; color: var(--dim); font-size: 12px; }
  #err { position: fixed; bottom: 10px; left: 10px; right: 10px; background: #5a1010; padding: 8px 10px; border-radius: 8px; display: none; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>BASKETBALL LAB · SWIPE (SPRITE STACK)</h1>
  <div><select id="action"><option value="clip" selected>clip (auto)</option><option value="swipe">swipe</option><option value="dribble">dribble</option><option value="stance">stance</option></select><button id="play">Play</button><button id="reset">Reset</button></div>
  <input id="t" type="range" min="0" max="1" step="0.005" value="0">
  <div id="readout"></div>
  <div id="note">Sprite stack: the body is rasterised from the basketball skeleton into 78 height layers (25 mm), each drawn as four planes. Yellow dot: the palm joint. Drag to orbit.</div>
</div>
<div id="err"></div>
<script type="module">
import * as THREE from './web/vendor/three.module.js';
import { OrbitControls } from './web/vendor/OrbitControls.js';
import { rasterise, VOXEL, G, X0, Z0, NL, BALL } from './web/basketball/sprite.js';
import { fk, D } from './web/basketball/skeleton.js';
import { SWIPE_SECONDS, STRIKE_T } from './web/basketball/actions.js';
import { LIBRARY, poseOf, holdCentre } from './web/basketball/library.js';

const showErr = (e) => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = String(e && e.stack || e); };
window.addEventListener('error', (e) => showErr(e.error || e.message));

const $ = (id) => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight, false);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fb8d0');
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 50);
camera.position.set(2.4, 3.4, 3.6);  // high: horizontal planes must be seen from above, not edge-on
const controls = new OrbitControls(camera, canvas);
controls.target.set(0.2, 0.9, 0);
controls.update();
// Court: a painted hardwood floor with the key, free-throw circle and baseline, and a hoop at the shot target.
// Canvas x runs from world x = -4.8 to 9.2 (14 m), canvas y from world z = +5 to -5 (10 m).
const COURT = { x0: -4.8, x1: 9.2, z0: -5, z1: 5 };
function courtTexture() {
  const cv = document.createElement('canvas'); cv.width = 1400; cv.height = 1000;
  const g = cv.getContext('2d');
  const X = (x) => (x - COURT.x0) / (COURT.x1 - COURT.x0) * cv.width;
  const Z = (z) => (COURT.z1 - z) / (COURT.z1 - COURT.z0) * cv.height;
  const m = (metres) => metres / (COURT.x1 - COURT.x0) * cv.width;
  g.fillStyle = '#c99a5b'; g.fillRect(0, 0, cv.width, cv.height);
  // hardwood boards: faint lines across the court
  g.strokeStyle = 'rgba(120,80,40,0.25)'; g.lineWidth = 2;
  for (let z = -5; z <= 5; z += 0.2) { g.beginPath(); g.moveTo(0, Z(z)); g.lineTo(cv.width, Z(z)); g.stroke(); }
  g.strokeStyle = '#ffffff'; g.lineWidth = Math.max(3, m(0.05));
  const rect = (x0, x1, z0, z1) => g.strokeRect(X(x0), Z(z1), X(x1) - X(x0), Z(z0) - Z(z1));
  const baseX = 4.775;                                  // baseline, 1.575 m behind the rim
  rect(-4.8, baseX, -2.45, 2.45);                       // sideline / baseline outline (half court)
  rect(baseX - 4.9, baseX, -2.45, 2.45);                // key (paint), 4.9 m deep and 4.9 m wide
  g.beginPath(); g.arc(X(baseX - 4.9), Z(0), m(1.8), -Math.PI / 2, Math.PI / 2); g.stroke();   // free-throw circle
  g.beginPath(); g.arc(X(3.2), Z(0), m(1.2), 0, Math.PI * 2); g.stroke();                       // restricted area
  g.beginPath(); g.arc(X(baseX - 4.9), Z(0), m(1.2), 0, Math.PI * 2); g.setLineDash([]); g.stroke(); // (kept simple)
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(COURT.x1 - COURT.x0, COURT.z1 - COURT.z0), new THREE.MeshBasicMaterial({ map: courtTexture() }));
floor.rotation.x = -Math.PI / 2; floor.position.set((COURT.x0 + COURT.x1) / 2, 0, 0); scene.add(floor);
// hoop: pole, backboard, rim (the shot target is HOOP)
const HOOP_RIM = [3.2, 3.05, 0];
const hoop = new THREE.Group();
const board = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1.05, 1.8), new THREE.MeshBasicMaterial({ color: '#f4f4f0' }));
board.position.set(3.4, 3.2, 0); hoop.add(board);
const rim = new THREE.Mesh(new THREE.TorusGeometry(0.23, 0.02, 8, 24), new THREE.MeshBasicMaterial({ color: '#e0572a' }));
rim.rotation.x = Math.PI / 2; rim.position.set(HOOP_RIM[0], HOOP_RIM[1], HOOP_RIM[2]); hoop.add(rim);
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3.05, 10), new THREE.MeshBasicMaterial({ color: '#777' }));
pole.position.set(4.1, 1.52, 0); hoop.add(pole);
scene.add(hoop);

// One texture + two planes per layer. The texture is rewritten each time the pose changes.
const LAYER_BYTES = G * G * 4;
const SUB = 4;                      // planes per layer: closes the gaps at low angles
const layerTex = [];
const stack = new THREE.Group();
const planeGeo = new THREE.PlaneGeometry(G * VOXEL, G * VOXEL);
const cx = X0 + G * VOXEL / 2, cz = Z0 + G * VOXEL / 2;
for (let k = 0; k < NL; k++) {
  const buf = new Uint8Array(LAYER_BYTES);
  const tex = new THREE.DataTexture(buf, G, G, THREE.RGBAFormat);
  tex.magFilter = tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  layerTex.push({ buf, tex });
  const mat = new THREE.MeshBasicMaterial({ map: tex, alphaTest: 0.5, transparent: false, side: THREE.DoubleSide });
  for (let s = 0; s < SUB; s++) {
    const m = new THREE.Mesh(planeGeo, mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(cx, (k + (s + 0.5) / SUB) * VOXEL, cz);
    stack.add(m);
  }
}
scene.add(stack);

// palm marker and ball outline, drawn over the sprite so the contact is readable
const palm = new THREE.Mesh(new THREE.SphereGeometry(0.02, 12, 10), new THREE.MeshBasicMaterial({ color: '#ffe066' }));
scene.add(palm);
const ballRing = new THREE.Mesh(new THREE.SphereGeometry(BALL.r, 16, 12), new THREE.MeshBasicMaterial({ color: '#ffffff', wireframe: true, transparent: true, opacity: 0.25 }));
ballRing.position.set(BALL.c[0], BALL.c[1], BALL.c[2]);
scene.add(ballRing);

// ---- automatic clip sequence. Every segment is one library action. Its ball rule
// (library.js `ball`) decides where the ball is: dribbled, held, released along a
// shot arc, passed, or bounced. Free flight uses gravity and a floor bounce.
const SEQ = [
  { a: 'stance', d: 0.8 }, { a: 'defendInPlace', d: 1.6 }, { a: 'defendSlide', d: 1.6 },
  { a: 'dribble', d: 2.4 }, { a: 'lowDribble', d: 2.0 }, { a: 'crossover', d: 1.8 },
  { a: 'swipe', d: 1.0 },
  { a: 'refPushPass', d: 3.0 }, { a: 'bouncePass', d: 1.6 }, { a: 'overheadPass', d: 1.6 }, { a: 'oneHandPass', d: 1.4 },
  { a: 'catch', d: 1.6 }, { a: 'refJumpShot', d: 2.8 }, { a: 'fadeaway', d: 2.0 }, { a: 'floater', d: 1.8 }, { a: 'block', d: 1.4 },
];
const SEQ_LEN = SEQ.reduce((n, s) => n + s.d, 0);
const GRAV = 9.8, FLOOR_E = 0.72;
const HOOP = [3.2, 3.05, 0];
const ballS = { x: 0.5, y: BALL.r, z: 0.3, vx: 0, vy: 0, vz: 0, held: false, free: true, struck: false };
let clipT = 0, lastU = -1, prevPalmY = null, segAt = -1, releaseDone = false, releasePos = null;
function segmentAt(u) {
  let acc = 0;
  for (let i = 0; i < SEQ.length; i++) {
    if (u < acc + SEQ[i].d) return { i, a: SEQ[i].a, local: u - acc, d: SEQ[i].d };
    acc += SEQ[i].d;
  }
  const L = SEQ[SEQ.length - 1];
  return { i: SEQ.length - 1, a: L.a, local: L.d, d: L.d };
}
const palmMid = (f) => [(f.palmR.p[0] + f.palmL.p[0]) / 2, (f.palmR.p[1] + f.palmL.p[1]) / 2, (f.palmR.p[2] + f.palmL.p[2]) / 2];
function setBall(x, y, z) { ballS.x = x; ballS.y = y; ballS.z = z; }
function clipFrame(dt) {
  clipT += dt;
  const u = clipT % SEQ_LEN;
  if (u < lastU) { setBall(0.5, BALL.r, 0.3); Object.assign(ballS, { vx: 0, vy: 0, vz: 0, held: false, free: true, struck: false }); prevPalmY = null; segAt = -1; }
  lastU = u;
  const sg = segmentAt(u);
  const info = LIBRARY[sg.a].ball || {};
  const tt = sg.a === 'dribble' || sg.a === 'lowDribble' || sg.a === 'crossover' ? (sg.local % 0.6) / 0.6
    : (sg.a === 'stance' || sg.a === 'defendInPlace' || sg.a === 'defendSlide') ? (sg.local % 1.0)
    : Math.min(1, sg.local / LIBRARY[sg.a].seconds);
  const p = poseOf(sg.a, tt);
  const f = fk(p);
  const palmP = f.palmR.p;
  const palmVy = prevPalmY === null ? 0 : (palmP[1] - prevPalmY) / Math.max(dt, 1e-3);
  prevPalmY = palmP[1];
  const mid = palmMid(f);
  const isDribble = info.kind === 'dribble';
  if (sg.i !== segAt) {
    segAt = sg.i; releaseDone = false;
    if (isDribble) { setBall(palmP[0], palmP[1] - 0.12, palmP[2]); Object.assign(ballS, { vy: 0, held: true, free: false, pushed: false }); }
    else if (ballS.held) { ballS.held = false; ballS.free = true; }
  }
  if (isDribble) {
    // the hand catches the ball only as it rises back from the floor, and releases it at the bottom of the push
    if (!ballS.held && ballS.vy > 0 && Math.hypot(ballS.x - palmP[0], ballS.z - palmP[2]) < 0.18 &&
        ballS.y <= palmP[1] - 0.05 && ballS.y >= palmP[1] - 0.6) { ballS.held = true; ballS.free = false; }
    if (ballS.held) {
      setBall(palmP[0], palmP[1] - 0.12, palmP[2]); ballS.vy = palmVy;
      if (palmVy < -0.05) ballS.pushed = true;                       // the hand has pushed down
      if (ballS.pushed && palmVy >= 0) { ballS.held = false; ballS.free = true; }   // released at the bottom of the push
    }
  } else if (sg.a === 'swipe') {
    ballS.free = false;
    if (tt < STRIKE_T) { setBall(BALL.c[0], BALL.c[1], BALL.c[2]); ballS.vx = ballS.vy = ballS.vz = 0; }
    else if (!ballS.struck) { ballS.struck = true; ballS.free = true; Object.assign(ballS, { vx: 3.2, vy: 1.6, vz: 0.4 }); }
  } else if (sg.a === 'catch') {
    const e = Math.min(1, tt / 0.6), k = e * e * (3 - 2 * e);
    if (tt < 0.6) setBall(2.0 + (mid[0] - 2.0) * k, 1.25 + (mid[1] - 1.25) * k, 0.1 + (mid[2] - 0.1) * k);
    else setBall(mid[0], mid[1], mid[2]);
    ballS.free = false;
  } else if (info.attach) {
    const at = holdCentre(f, info.attach);   // the ball's surface sits on the hand(s), never between them
    if (info.release === undefined || tt < info.release) { setBall(at[0], at[1], at[2]); ballS.free = false; ballS.vx = ballS.vy = ballS.vz = 0; }
    else if (!releaseDone) {
      releaseDone = true; ballS.free = true;
      releasePos = [at[0], at[1], at[2]];
      if (info.kind === 'arc') {
        // launch so the ball reaches the hoop after info.dt seconds
        const T = info.dt;
        Object.assign(ballS, { vx: (HOOP[0] - releasePos[0]) / T, vz: (HOOP[2] - releasePos[2]) / T, vy: (HOOP[1] - releasePos[1] + 0.5 * GRAV * T * T) / T });
      } else if (info.vel) {
        Object.assign(ballS, { vx: info.vel[0], vy: info.vel[1], vz: info.vel[2] });
      }
    }
  }
  // free flight: gravity and a floor bounce, whenever the ball is not held
  if (ballS.free && !ballS.held && !(sg.a === 'swipe' && !ballS.struck)) {
    ballS.vy -= GRAV * dt;
    ballS.x += (ballS.vx || 0) * dt; ballS.y += ballS.vy * dt; ballS.z += (ballS.vz || 0) * dt;
    if (ballS.y <= BALL.r) { ballS.y = BALL.r; ballS.vy = -ballS.vy * FLOOR_E; ballS.vx *= 0.85; ballS.vz *= 0.85; }
  }
  const ballC = [ballS.x, ballS.y, ballS.z];
  const { data } = rasterise(p, ballC);
  for (let k = 0; k < NL; k++) {
    const { buf, tex } = layerTex[k];
    buf.set(data.subarray(k * LAYER_BYTES, (k + 1) * LAYER_BYTES));
    tex.needsUpdate = true;
  }
  palm.position.set(palmP[0], palmP[1], palmP[2]);
  ballRing.position.set(ballC[0], ballC[1], ballC[2]);
  $('readout').textContent =
    `clip ${sg.i + 1}/${SEQ.length}: ${sg.a}   t ${clipT.toFixed(1)} s
` +
    `ball height ${ballS.y.toFixed(2)} m   palm height ${palmP[1].toFixed(2)} m
` +
    `toe lift R ${(Math.abs(f.toeR.p[1]) * 1000).toFixed(1)} mm  L ${(Math.abs(f.toeL.p[1]) * 1000).toFixed(1)} mm`;
}

let t = 0, playing = false, lastT = -1, action = 'clip';
function pose(tt) {
  if (action === 'clip') return;
  if (tt === lastT) return;
  lastT = tt;
  const { data } = rasterise(poseOf(action, tt));
  for (let k = 0; k < NL; k++) {
    const { buf, tex } = layerTex[k];
    buf.set(data.subarray(k * LAYER_BYTES, (k + 1) * LAYER_BYTES));
    tex.needsUpdate = true;
  }
  const f = fk(poseOf(action, tt));
  const pp = f.palmR.p;
  palm.position.set(pp[0], pp[1], pp[2]);
  const dist = Math.hypot(pp[0] - BALL.c[0], pp[1] - BALL.c[1], pp[2] - BALL.c[2]) - BALL.r;
  const pose0 = LIBRARY[action].pose(tt);
  const deg = (r) => (r / D).toFixed(0).padStart(4);
  $('readout').textContent =
    `t ${tt.toFixed(2)}   shoulder flex ${deg(pose0.shR[0])}  abd ${deg(pose0.shR[1])}\n` +
    `elbow ${deg(pose0.elR)}   wrist ${deg(pose0.wrR[0])}\n` +
    (action === 'swipe' ? `palm to ball surface ${(dist * 100).toFixed(1).padStart(5)} cm  (strike at t ${STRIKE_T})\n` : `palm height ${pp[1].toFixed(2)} m\n`) +
    `toe lift R ${(Math.abs(f.toeR.p[1]) * 1000).toFixed(1)} mm  L ${(Math.abs(f.toeL.p[1]) * 1000).toFixed(1)} mm`;
}

$('t').addEventListener('input', (e) => { t = +e.target.value; playing = false; $('play').textContent = 'Play'; pose(t); });
$('play').addEventListener('click', () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; if (playing && t >= 1) t = 0; });
$('reset').addEventListener('click', () => { t = 0; playing = false; $('play').textContent = 'Play'; $('t').value = 0; pose(0); });
$('action').addEventListener('change', (e) => { action = e.target.value; t = 0; playing = false; lastT = -1; clipT = 0; lastU = -1; $('play').textContent = 'Play'; $('t').value = 0; pose(0); });

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (action === 'clip') clipFrame(dt);
  else if (playing) {
    t = Math.min(1, t + dt / (LIBRARY[action] ? LIBRARY[action].seconds : SWIPE_SECONDS));
    $('t').value = t;
    if (t >= 1) { playing = false; $('play').textContent = 'Play'; }
    pose(t);
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
try {
  pose(0);
  requestAnimationFrame(frame);
} catch (e) { showErr(e); }
</script>
</body>
</html>
